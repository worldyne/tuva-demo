version: 2

models:
  - name: condition
    config:
      schema: input_layer
      tags: tuva_demo
    columns:
      - name: normalized_code
        description: Normalized diagnosis code
        tests:
          - not_null:
              config:
                severity: warn
      - name: normalized_code_type
        description: Code system type (e.g., icd-10-cm)
        tests:
          - not_null:
              config:
                severity: warn

  - name: encounter
    config:
      schema: input_layer
      tags: tuva_demo

  - name: location
    config:
      schema: input_layer
      tags: tuva_demo

  - name: medication
    config:
      schema: input_layer
      tags: tuva_demo

  - name: patient
    config:
      schema: input_layer
      tags: tuva_demo

  - name: practitioner
    config:
      schema: input_layer
      tags: tuva_demo

  - name: procedure
    config:
      schema: input_layer
      tags: tuva_demo
